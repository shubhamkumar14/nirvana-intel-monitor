<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last-Mile Intel Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--ink:#16181d;--muted:#5f6470;--faint:#8a8f99;--line:#e4e2dc;
  --accent:#1f4fd1;--accent-soft:#e8eefc;--good:#17784a;--good-soft:#e3f3ea;--warn:#a35a00;--warn-soft:#fbf0de;
  --bad:#b3261e;--bad-soft:#fbe7e5;--chip:#efeee9;--shadow:0 1px 2px rgba(20,20,30,.05),0 4px 16px rgba(20,20,30,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317;--panel:#181b21;--ink:#ecedf0;--muted:#a4a9b4;--faint:#7c818c;--line:#2a2e36;
  --accent:#7aa2ff;--accent-soft:#1d2740;--good:#5fd39a;--good-soft:#16302a;--warn:#f0b35a;--warn-soft:#33281a;
  --bad:#ff8a80;--bad-soft:#3a1f1f;--chip:#22262e;--shadow:none}}
:root[data-theme="dark"]{--bg:#111317;--panel:#181b21;--ink:#ecedf0;--muted:#a4a9b4;--faint:#7c818c;--line:#2a2e36;
  --accent:#7aa2ff;--accent-soft:#1d2740;--good:#5fd39a;--good-soft:#16302a;--warn:#f0b35a;--warn-soft:#33281a;
  --bad:#ff8a80;--bad-soft:#3a1f1f;--chip:#22262e;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:20px}
h1{font:600 30px/1.15 Newsreader,Georgia,serif;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:6px;font-size:14px}
.status{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:8px 0 22px;scrollbar-width:none}
nav button{all:unset;cursor:pointer;padding:10px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
nav .n{font-size:11px;background:var(--chip);border-radius:8px;padding:1px 6px;margin-left:5px;color:var(--muted)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h2{font:600 21px/1.2 Newsreader,Georgia,serif;margin:0 0 4px}
.hero .meta{color:var(--muted);font-size:13px}
.digest{white-space:pre-line;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14.5px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font:600 20px Newsreader,Georgia,serif;color:var(--ink);margin-bottom:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.toolbar input{flex:1;min-width:180px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:10px;box-shadow:var(--shadow)}
.card .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted);font-weight:500}
.tag.lane{background:var(--accent-soft);color:var(--accent)}
.tag.head{background:var(--bad-soft);color:var(--bad)} .tag.tail{background:var(--good-soft);color:var(--good)}
.tag.ver-c{background:var(--good-soft);color:var(--good)} .tag.new{background:var(--ink);color:var(--bg)} .tag.upd{background:var(--warn-soft);color:var(--warn)}
.score{margin-left:auto;font:600 13px Inter;color:var(--ink);font-variant-numeric:tabular-nums}
.card h3{font-size:16px;line-height:1.35;margin:0 0 6px;font-weight:600}
.card h3 a{text-decoration:none} .card h3 a:hover{text-decoration:underline}
.card p{margin:0 0 8px;color:var(--muted);font-size:14px}
.quote{border-left:2px solid var(--line);padding-left:10px;font-size:13px;color:var(--muted);margin:8px 0;font-style:italic}
.srcs{font-size:12.5px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap}
.srcs a{color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols h4,.sec-h{font:600 13px Inter;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 10px}
@media (max-width:720px){.cols{grid-template-columns:1fr}.score{margin-left:0}}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.num{font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--chip)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font:600 22px Inter;font-variant-numeric:tabular-nums} .kpi .l{font-size:12px;color:var(--muted)}
.st-ok{color:var(--good)} .st-error{color:var(--bad)} .st-skipped_robots{color:var(--warn)}
.note{font-size:12.5px;color:var(--faint);margin-top:10px}
.theme{all:unset;cursor:pointer;font-size:12px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:999px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Last-Mile Commercial Auto · Intel Monitor</h1>
      <div class="sub">Automated daily scan of competitors, market drivers, research and policy signals. Every item links to its source.</div>
    </div>
    <div class="status" id="status"></div>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"><div class="empty">Loading…</div></main>
  <div class="note">Built for Nirvana leadership review · data refreshes daily via GitHub Actions · <button class="theme" id="themeBtn">Toggle theme</button></div>
</div>
<script>
const D = {};
const LANES = {competitor_move:"Competitor move", market_driver:"Market driver", research:"Research", policy_macro:"Policy / macro"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = s => s ? new Date(s).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "—";
const fmtDay = s => s ? new Date(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"}) : "—";
const age = d => d==null ? "date unknown" : d < 1 ? "today" : `${Math.round(d)}d ago`;

async function j(path, fallback){ try{ const r = await fetch(path+"?t="+Date.now()); if(!r.ok) return fallback; return await r.json(); }catch(e){ return fallback; } }

function card(e, opts={}){
  const dir = e.direction==="headwind" ? '<span class="tag head">Headwind</span>' : e.direction==="tailwind" ? '<span class="tag tail">Tailwind</span>' : "";
  const ver = `<span class="tag ${e.verification==="Reported"?"":"ver-c"}">${esc(e.verification||"")}</span>`;
  const badge = opts.badge==="new" ? '<span class="tag new">NEW</span>' : opts.badge==="upd" ? '<span class="tag upd">UPDATED</span>' : "";
  const late = e.late_discovery ? '<span class="tag">late discovery</span>' : "";
  const comps = (e.watchlist_companies||[]).map(c=>`<span class="tag">${esc(c)}</span>`).join("");
  const srcs = e.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.publisher)}</a> <span title="source tier">T${s.tier}</span>`).join(" · ");
  return `<div class="card">
    <div class="top">${badge}<span class="tag lane">${esc(LANES[e.lane]||e.lane)}</span><span class="tag">${esc((e.event_type||"").replace(/_/g," "))}</span>${dir}${ver}${comps}${late}
      <span class="score" title="materiality ${e.score_parts?.materiality}/5 · priority ${e.score_parts?.priority} · tier ${e.score_parts?.tier} · recency ${e.score_parts?.recency} · fit ${e.score_parts?.last_mile_fit}">${e.score}</span></div>
    <h3><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></h3>
    ${e.summary && e.summary!==e.title ? `<p>${esc(e.summary)}</p>` : ""}
    ${e.evidence_quote && e.evidence_quote!==e.title ? `<div class="quote">Evidence: “${esc(e.evidence_quote)}”</div>` : ""}
    ${e.update_note && opts.badge==="upd" ? `<p><b>${esc(e.update_note)}</b></p>` : ""}
    <div class="srcs"><span>Published ${e.published ? fmtDay(e.published) : "—"} · ${age(e.age_days)}</span><span>${srcs}</span><span>classifier: ${esc(e.classifier)}</span></div>
  </div>`;
}

function whatsNew(){
  const L = D.latest;
  if(!L) return `<div class="hero"><div class="empty"><div class="big">No pulls yet</div>The first scheduled run will populate this page.</div></div>`;
  const n = L.whats_new.new, u = L.whats_new.updated;
  if(L.baseline) return `<div class="hero"><h2>Baseline pull complete</h2><div class="meta">${fmtDate(L.started)} · ${L.total_events} events indexed across all tabs</div>
     <div class="empty"><div class="big">What's New starts with the next pull</div>This section only shows information that is new since the previous day's pull. Browse the other tabs for everything indexed so far.</div></div>`;
  if(!n.length && !u.length) return `<div class="hero"><h2>What's New</h2><div class="meta">Pull ${fmtDate(L.started)} vs previous pull ${fmtDate(L.previous_started)}</div>
     <div class="empty"><div class="big">No new developments since yesterday's pull</div>${L.counts.unique} items checked from ${D.runs.at(-1)?.health?.length||0} source queries; nothing new passed relevance and verification.</div></div>`;
  return `<div class="hero"><h2>What's New</h2><div class="meta">${n.length} new · ${u.length} updated · pull ${fmtDate(L.started)} vs previous ${fmtDate(L.previous_started)}</div>
    ${L.digest ? `<div class="digest">${esc(L.digest)}</div>` : ""}</div>
    ${n.map((e,i)=>card(e,{badge:"new"})).join("")}${u.map(e=>card(e,{badge:"upd"})).join("")}`;
}

function laneView(lanes, extra=""){
  const evs = Object.values(D.events).filter(e=>lanes.includes(e.lane));
  const comps = [...new Set(evs.flatMap(e=>e.watchlist_companies||[]))].sort();
  const id = "f"+lanes.join("");
  setTimeout(()=>{
    const q=document.getElementById(id+"q"), c=document.getElementById(id+"c"), t=document.getElementById(id+"t"), out=document.getElementById(id+"o");
    const render=()=>{ const qs=q.value.toLowerCase();
      const list=evs.filter(e=>(!c.value||(e.watchlist_companies||[]).includes(c.value)) && (!t.value||e.event_type===t.value) && (!qs||(e.title+" "+e.summary).toLowerCase().includes(qs)))
        .sort((a,b)=>b.score-a.score);
      out.innerHTML = list.length ? list.map(e=>card(e)).join("") : `<div class="empty">Nothing matches.</div>`; };
    [q,c,t].forEach(x=>x&&x.addEventListener("input",render)); render();
  });
  const types=[...new Set(evs.map(e=>e.event_type))].sort();
  return `${extra}<div class="toolbar"><input id="${id}q" placeholder="Search ${evs.length} items…">
    <select id="${id}c"><option value="">All companies</option>${comps.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
    <select id="${id}t"><option value="">All event types</option>${types.map(t=>`<option value="${t}">${t.replace(/_/g," ")}</option>`).join("")}</select></div><div id="${id}o"></div>`;
}

function radar(){
  const evs = Object.values(D.events).filter(e=>e.lane==="market_driver"||e.lane==="policy_macro"||e.lane==="research").sort((a,b)=>b.score-a.score);
  const col = d => evs.filter(e=>e.direction===d).slice(0,25).map(e=>card(e)).join("") || `<div class="empty">None yet.</div>`;
  return `<div class="cols"><div><h4>Headwinds</h4>${col("headwind")}</div><div><h4>Tailwinds</h4>${col("tailwind")}</div></div>
    <h4 class="sec-h" style="margin-top:18px">Neutral / context</h4>${col("neutral")}`;
}

function entities(){
  const ents = Object.values(D.entities||{}).sort((a,b)=>b.mentions-a.mentions);
  if(!ents.length) return `<div class="empty"><div class="big">No new companies discovered yet</div>Discovery needs the Claude classifier (extracts organizations from articles and flags anyone not on the watchlist).</div>`;
  return `<p class="sub">Organizations found in relevant coverage that are <b>not</b> on the watchlist. Proposed for human review before promotion.</p>
   <div class="scroll"><table><tr><th>Company</th><th>Mentions</th><th>First seen</th><th>Latest evidence</th></tr>
   ${ents.map(x=>{ const e=D.events[x.event_ids.at(-1)]; return `<tr><td><b>${esc(x.name)}</b></td><td class="num">${x.mentions}</td><td>${fmtDay(x.first_seen)}</td><td>${e?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:"—"}</td></tr>`}).join("")}</table></div>`;
}

function pullsView(){
  const idx = [...(D.pulls||[])].reverse();
  if(!idx.length) return `<div class="empty">No pulls yet.</div>`;
  setTimeout(()=>document.querySelectorAll("tr[data-file]").forEach(tr=>tr.onclick=async()=>{
    const p = await j("data/"+tr.dataset.file, null), out=document.getElementById("pullDetail"); if(!p) return;
    out.innerHTML = `<div class="hero"><h2>Pull ${fmtDate(p.started)}</h2><div class="meta">${p.baseline?"Baseline pull":`${p.new.length} new · ${p.updated.length} updated`} · ${p.counts.unique} unique items · classifier ${p.classifier} · ${p.duration_s}s</div>${p.digest?`<div class="digest">${esc(p.digest)}</div>`:""}</div>
      ${p.new.map(e=>card(e,{badge:"new"})).join("")}${p.updated.map(e=>card(e,{badge:"upd"})).join("")}
      ${p.baseline?`<div class="empty">Baseline pulls establish history; deltas start the next day.</div>`:(!p.new.length&&!p.updated.length?`<div class="empty">Nothing new in this pull.</div>`:"")}`;
    out.scrollIntoView({behavior:"smooth"});
  }));
  return `<p class="sub">Every daily pull is stored as its own snapshot (and versioned in git). Click a row to see what it surfaced.</p>
   <div class="scroll"><table><tr><th>Pull</th><th>New</th><th>Updated</th><th>Type</th></tr>
   ${idx.map(p=>`<tr class="click" data-file="${esc(p.file)}"><td>${fmtDate(p.started)}</td><td class="num">${p.new}</td><td class="num">${p.updated}</td><td>${p.baseline?"baseline":"daily delta"}</td></tr>`).join("")}</table></div><div id="pullDetail" style="margin-top:18px"></div>`;
}

function health(){
  const r = D.runs.at(-1); if(!r) return `<div class="empty">No runs yet.</div>`;
  const pct = v => v==null ? "—" : Math.round(v*100)+"%";
  const ev = r.evals, c = r.counts;
  const g = D.evals?.results || {};
  const gRow = (k,v)=> v && v.relevance_precision!=null ? `<tr><td>${k}${v.model?" ("+esc(v.model)+")":""}</td><td class="num">${pct(v.relevance_precision)}</td><td class="num">${pct(v.relevance_recall)}</td><td class="num">${pct(v.lane_accuracy)}</td><td class="num">${v.n}</td></tr>` : (v?.skipped?`<tr><td>${k}</td><td colspan="4">${esc(v.skipped)}</td></tr>`:"");
  return `<div class="kpis">
    <div class="kpi"><div class="v">${pct(ev.source_success_rate)}</div><div class="l">sources fetched OK</div></div>
    <div class="kpi"><div class="v">${pct(ev.verification_pass_rate)}</div><div class="l">AI claims verified against source text</div></div>
    <div class="kpi"><div class="v">${pct(ev.date_coverage)}</div><div class="l">new items with a known publish date</div></div>
    <div class="kpi"><div class="v">${ev.median_age_days_new ?? "—"}</div><div class="l">median age of new items (days)</div></div>
    <div class="kpi"><div class="v">${c.unique}</div><div class="l">unique items scanned</div></div>
    <div class="kpi"><div class="v">${c.quarantined}</div><div class="l">quarantined (unverifiable)</div></div></div>
   <h4 class="sec-h">Last run funnel · ${fmtDate(r.started)} · ${r.duration_s}s · classifier: ${esc(r.classifier)}</h4>
   <div class="scroll"><table><tr>${Object.keys(c).map(k=>`<th>${k.replace(/_/g," ")}</th>`).join("")}</tr><tr>${Object.values(c).map(v=>`<td class="num">${v}</td>`).join("")}</tr></table></div>
   ${D.evals?`<h4 class="sec-h" style="margin-top:18px">Classifier eval (golden set)</h4><div class="scroll"><table><tr><th>Mode</th><th>Relevance precision</th><th>Relevance recall</th><th>Lane accuracy</th><th>n</th></tr>${gRow("Claude",g.llm)}${gRow("Rules",g.rules)}</table></div><div class="note">${esc(D.evals.golden_set||"")}</div>`:""}
   <h4 class="sec-h" style="margin-top:18px">Source health (${r.health.length} source queries)</h4>
   <div class="scroll"><table><tr><th>Source</th><th>Status</th><th>Items</th><th>ms</th><th>Detail</th></tr>
   ${r.health.map(h=>`<tr><td>${esc(h.name)}</td><td class="st-${h.status}">${h.status}</td><td class="num">${h.items}</td><td class="num">${h.ms}</td><td>${esc(h.error||"")}</td></tr>`).join("")}</table></div>
   <h4 class="sec-h" style="margin-top:18px">Run history</h4>
   <div class="scroll"><table><tr><th>Run</th><th>Sources OK</th><th>Scanned</th><th>New</th><th>Updated</th><th>Verified</th></tr>
   ${[...D.runs].reverse().slice(0,30).map(x=>`<tr><td>${fmtDate(x.started)}</td><td class="num">${pct(x.evals.source_success_rate)}</td><td class="num">${x.counts.unique}</td><td class="num">${x.counts.new_events}</td><td class="num">${x.counts.updated_events}</td><td class="num">${pct(x.evals.verification_pass_rate)}</td></tr>`).join("")}</table></div>`;
}

const TABS = [
  ["new","What's New",()=>whatsNew(),()=>D.latest&&!D.latest.baseline?D.latest.whats_new.new.length+D.latest.whats_new.updated.length:0],
  ["comp","Competitor Moves",()=>laneView(["competitor_move"]),()=>Object.values(D.events).filter(e=>e.lane==="competitor_move").length],
  ["radar","Market Radar",()=>radar(),()=>Object.values(D.events).filter(e=>["market_driver","policy_macro","research"].includes(e.lane)).length],
  ["research","Research",()=>laneView(["research"])],
  ["policy","Policy & Macro",()=>laneView(["policy_macro"])],
  ["disc","New on the Radar",()=>entities(),()=>Object.keys(D.entities||{}).length],
  ["hist","Daily Pulls",()=>pullsView(),()=>(D.pulls||[]).length],
  ["health","Health & Evals",()=>health()],
];
function show(key){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.k===key));
  document.getElementById("view").innerHTML = TABS.find(t=>t[0]===key)[2]();
  window.history.replaceState(null,"","#"+key);
}
(async()=>{
  [D.latest,D.events,D.runs,D.pulls,D.entities,D.evals] = await Promise.all([
    j("data/latest.json",null), j("data/events.json",{}), j("data/runs.json",[]), j("data/pulls/index.json",[]), j("data/entities.json",{}), j("data/evals.json",null)]);
  const r = D.runs.at(-1);
  const ok = r ? r.evals.source_success_rate : null;
  document.getElementById("status").innerHTML = r ? `
    <span class="pill">Last pull <b>${fmtDate(r.started)}</b></span>
    <span class="pill ${ok>=0.7?"ok":"warn"}">Sources OK <b>${Math.round((ok||0)*100)}%</b></span>
    <span class="pill">Classifier <b>${r.classifier==="llm"?"Claude":"Rules"}</b></span>
    <span class="pill">${D.runs.length} pulls · ${Object.keys(D.events).length} events</span>` : `<span class="pill warn">No runs yet</span>`;
  document.getElementById("tabs").innerHTML = TABS.map(t=>`<button role="tab" data-k="${t[0]}">${t[1]}${t[3]?`<span class="n">${t[3]()}</span>`:""}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.k));
  const h = location.hash.slice(1); show(TABS.some(t=>t[0]===h)?h:"new");
})();
document.getElementById("themeBtn").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("theme",r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
</script>
</body>
</html>
